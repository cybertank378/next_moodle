name: Enforce Main PR Source Branch

on:
  pull_request_target:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  verify-source-branch:
    name: Verify PR Source is Development
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          echo "Target branch: main"
          echo "Source branch: $HEAD_REF"
          if [ "$HEAD_REF" != "development" ]; then
            echo "::error::Pull requests targeting 'main' are only allowed from the 'development' branch. Detected source branch: '$HEAD_REF'."
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "❌ **Pull Request Ditolak**: Pull request ke branch \`main\` tidak boleh dilakukan secara langsung dari branch \`$HEAD_REF\`. Seluruh perubahan harus melalui branch \`development\` terlebih dahulu."
            gh pr close "$PR_NUMBER" --repo "$REPO"
            exit 1
          fi
          echo "✅ Source branch is 'development'. Validation passed."
